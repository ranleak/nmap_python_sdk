name: Build Nmap SDK Wheels

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }} for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            script: build_nmap_linux.sh
          - os: macos-latest
            target: macos
            script: build_nmap_macos.sh
          - os: ubuntu-latest
            target: android
            script: build_nmap_android.sh

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python build dependencies
        run: python -m pip install --upgrade pip build

      - name: Setup Android NDK (Android target only)
        if: matrix.target == 'android'
        run: echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

        # This step runs ONLY on macOS and isolates all of the macOS config logic
      - name: Prepare macOS Environment (macOS only)
        if: matrix.target == 'macos'
        run: |
          # 1. Explicitly install OpenSSL
          brew install openssl@3

          # 2. Dynamically look up the prefix (works for both Intel and Apple Silicon)
          OPENSSL_DIR=$(brew --prefix openssl@3)

          # 3. Save environment variables globally for subsequent steps
          echo "CPPFLAGS=-I$OPENSSL_DIR/include" >> $GITHUB_ENV
          echo "LDFLAGS=-L$OPENSSL_DIR/lib" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$OPENSSL_DIR/lib/pkgconfig" >> $GITHUB_ENV

        # This step now stays clean and completely generic for Linux, Android, and macOS
      - name: Compile Nmap
        run: |
          # Run the build script
          chmod +x ci-build-scripts/${{ matrix.script }}
          ./ci-build-scripts/${{ matrix.script }}

      - name: Build Python Wheel
        run: python -m build

      - name: Upload Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: nmap-sdk-${{ matrix.target }}-wheels
          path: dist/*
          retention-days: 7